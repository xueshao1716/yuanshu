name: Quality baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run verify
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          retention-days: 7
          path: |
            tmp/verification-unit.log
            tmp/verification-types.log
            tmp/verification-build.log
            tmp/verification-skills.json
            tmp/review-verification.json
