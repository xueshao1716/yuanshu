[package]
name = "yuanshu"
version = "2.105.0"
description = "元枢 · 个人智能系统（壳客户端）"
authors = ["yuanshu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "yuanshu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 优化体积
[profile.release]
strip = true
lto = true
codegen-units = 1
