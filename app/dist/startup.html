<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接元枢</title>
  <link rel="stylesheet" href="startup.css">
  <script type="module" src="startup.mjs"></script>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="17" stroke="var(--accent)" stroke-width="1.5" opacity="0.3"/>
        <circle cx="18" cy="8"  r="4" fill="var(--accent)"/>
        <circle cx="10" cy="24" r="4" fill="var(--accent)" opacity="0.7"/>
        <circle cx="26" cy="24" r="4" fill="var(--accent)" opacity="0.7"/>
        <line x1="18" y1="12" x2="10" y2="20" stroke="var(--accent)" stroke-width="1.5" opacity="0.5"/>
        <line x1="18" y1="12" x2="26" y2="20" stroke="var(--accent)" stroke-width="1.5" opacity="0.5"/>
        <line x1="10" y1="24" x2="26" y2="24" stroke="var(--accent)" stroke-width="1.5" opacity="0.5"/>
      </svg>
    </div>
    <h1>连接元枢</h1>
    <p class="subtitle">填写工作台地址和令牌，可连接本机或任意远程服务器。</p>

    <form id="connect-form" novalidate>
      <label for="address">工作台地址</label>
      <input id="address" type="url" autocomplete="url" spellcheck="false"
             placeholder="http://127.0.0.1:8787 或 https://example.com"
             value="http://127.0.0.1:8787" />
      <label for="token">访问令牌</label>
      <input id="token" type="password" autocomplete="current-password"
             placeholder="粘贴 .token 文件内容" />
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button id="connect" type="submit">连接</button>
    </form>

    <details>
      <summary>连接本机需要什么？</summary>
      <p>本机地址 (127.0.0.1:8787) 需要电脑上已安装并启动元枢服务，且注册了 yuanshu-watchdog 守护任务。远程地址无此要求，直接填写即可。</p>
    </details>
  </main>
</body>
</html>
